# Frozen snapshot of the configuration that produced fobtm1lu, with exactly
# one intended model change: use the full-LIBERO gated-AdaLN DeltaWorld at
# step 3125. Launch with the APS checkpoint via --ckpt_path for a full-state
# resume from global step 28737 to 33737 (5000 additional optimizer steps).
model:
  class_path: training.feature_conditioned_action.FeatureConditionedAction
  init_args:
    delta_world:
      class_path: models.deltaworld.DeltaWorld
      init_args:
        max_cameras: 4
        use_camera_embedding: true
        tokenizer:
          class_path: models.deltatok.DeltaTok
          init_args:
            ckpt_path: checkpoints/deltatok_kinetics.bin
            backbone:
              class_path: models.dinov3.DINOv3
              init_args:
                backbone_name: https://www.kaggle.com/models/x1an9l1/facebookdinov3-vitb16-pretrain-lvd1689m
        use_task_film: true
        task_film_text_encoder_name: google-t5/t5-base
        task_film_text_encoder_max_length: 64
        freeze_task_film_text_encoder: true
        task_film_scale: 1.0
        task_film_gated_residual: true
        use_task_cross_attn: false
    world_ckpt_path: checkpoints/deltaworld_libero_step3125.ckpt
    freeze_world: true
    num_world_samples: 8
    oracle_branch_probability: 0.5
    context_frames: 4
    world_prediction_steps: 6
    world_time_delta: 0.1
    action_dim: 7
    action_horizon: 16
    action_hidden_dim: 768
    action_num_layers: 12
    action_num_heads: 12
    action_head_dim: 64
    action_ffn_ratio: 4
    action_text_dim: 256
    action_freq_dim: 256
    action_eps: 1.0e-06
    action_init_path: checkpoints/actiondit_wan22_init.pt
    action_head_init: random
    text_encoder_name: google-t5/t5-base
    text_encoder_max_length: 64
    freeze_text_encoder: true
    proprio_dim: 9
    action_history_steps: 8
    action_history_dropout: 0.2
    action_history_attention_mode: separate_gated
    action_history_gate_init: 0.01
    action_warmstart_path: checkpoints/actiondit_libero90_step28737.ckpt
    learning_rate: 5.0e-05
    weight_decay: 0.01
    warmup_steps: 500
    lr_scheduler_type: cosine
    resume_lr_warmup_steps: 1
    min_lr_ratio: 0.1
    scheduler_num_train_timesteps: 1000
    use_compile: false
    scheduler_train_shift: 5.0
    scheduler_infer_shift: 5.0
data:
  class_path: datasets.action_module.ActionDataModule
  init_args:
    frame_size: 512
    batch_size: 32
    val_batch_size: 16
    num_workers: 4
    prefetch_factor: 2
    train_dataset_cfg:
      class_path: datasets.libero_action.LiberoActionTrain
      init_args:
        suites:
        - libero_spatial
        cameras:
        - agentview_rgb
        - eye_in_hand_rgb
        camera_layout: multi_view
        context_frames: 4
        context_frame_stride: 2
        world_prediction_steps: 6
        world_frame_stride: 2
        action_horizon: 16
        action_history_steps: 8
        fps: 20.0
        seed: 0
        expert_demo_whitelist_path: splits/libero_spatial_verified.json
        task_sampling: balanced
        base_all_tasks_probability: 1.0
        hard_tasks_probability: 0.0
        hard_task_phase_sampling_probability: 0.7
        phase_sampling_weights: {grasp: 0.25, release: 0.20, precision: 0.40, terminal: 0.15}
        phase_pre_event_steps: 8
        phase_post_event_steps: 2
        phase_terminal_window_steps: 24
        hard_task_names:
        - pick_up_the_black_bowl_in_the_top_drawer_of_the_wooden_cabinet_and_place_it_on_the_plate
        - pick_up_the_black_bowl_on_the_wooden_cabinet_and_place_it_on_the_plate
    val_dataset_cfg:
      class_path: datasets.libero_action.LiberoActionVal
      init_args:
        suites:
        - libero_spatial
        cameras:
        - agentview_rgb
        - eye_in_hand_rgb
        camera_layout: multi_view
        context_frames: 4
        context_frame_stride: 2
        world_prediction_steps: 6
        world_frame_stride: 2
        action_horizon: 16
        action_history_steps: 8
        fps: 20.0
        expert_demo_whitelist_path: splits/libero_spatial_verified.json
        max_samples: 128
trainer:
  devices: 2
  max_steps: 33737
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  val_check_interval: 1000
  limit_val_batches: 64
  num_sanity_val_steps: 1
